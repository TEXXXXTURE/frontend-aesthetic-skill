<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stone House — Architecture of Stillness</title>
<style>
  :root {
    --sand: #e9dfcc;           /* 沙 */
    --ink: #40372c;            /* 墨 */
    --earth: #796c5b;          /* 土灰 */
    --sky-a: #cbd5cd;          /* 石灰蓝 */
    --sky-b: #ece0c6;          /* 奶油 */
    --sun: #fff2cd;            /* 太阳 */
    --sun-glow: #fff3b9;
    --land: #c3a37f;           /* 土地 */
    --wall-a: #d5c5a7;         /* 房屋亮 */
    --wall-b: #eee0c7;
    --door-a: #372f24;         /* 门深 */
    --door-b: #64523b;
    --border: #40372c33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--sand);
    color: var(--ink);
    font-family: Arial, sans-serif;
  }
  /* ① 字体：Georgia 衬线 display + Arial 正文/标签 9px + 大字距 */
  .logo, h1, .specs strong {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
  }
  .logo {
    font-size: 32px;
    letter-spacing: 8px;             /* 样本 004：logo 8px 字距 */
  }
  header {
    padding: 25px 5%;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  header span {
    font-size: 9px; letter-spacing: 2px;   /* 样本 004：标签 9px + 2px 字距 */
  }

  /* ③ 间距网格：36%/64% 不对称分栏 + 大留白 */
  .layout {
    display: grid;
    grid-template-columns: 36% 64%;        /* 样本 004：36/64 不对称 */
    min-height: 78vh;
  }
  .copy {
    padding: 10vh 3vw 40px 5vw;            /* 样本 004：大留白 */
    display: flex; flex-direction: column; align-items: start;
  }
  .tiny {
    font-size: 9px; letter-spacing: 3px;   /* 样本 004：tiny 标签 */
  }
  h1 {
    font-size: clamp(50px, 6.5vw, 100px);  /* 样本 004：巨型衬线 */
    line-height: 0.97;
    letter-spacing: -4px;                  /* 样本 004：-4px 字距 */
    margin: 32px 0;
  }
  .copy p {
    font: 13px/1.9 Arial;                  /* 样本 004：Arial 正文 13px/1.9 */
    max-width: 270px;                      /* 样本 004：窄栏 */
    color: var(--earth);
  }
  button {
    margin-top: 30px;
    background: none;
    border: 1px solid #766650;
    border-radius: 30px;
    color: inherit;
    padding: 14px 20px;
    font: 10px Arial;
    letter-spacing: 2px;
    cursor: pointer;
  }
  button:hover { background: var(--ink); color: #f5e7d3; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .specs {
    margin-top: auto; padding-top: 40px;
    display: flex; gap: 30px;              /* 样本 004：gap 30px */
    font-size: 9px; letter-spacing: 1px;
  }
  .specs strong {
    font-size: 26px; display: block; margin-bottom: 8px;   /* 样本 004：26px Georgia 数字 */
  }

  /* ⑤ 背景质感：纯 CSS 建筑插画（零图片零依赖）+ 多层渐变 */
  .scene {
    position: relative; overflow: hidden;
    min-height: 570px;
    background: linear-gradient(var(--sky-a), var(--sky-b) 65%);
    transition: filter 1s;                 /* ④ 日光/暮光切换 1s */
  }
  .sun {
    position: absolute; top: 12%; right: 17%;
    width: 85px; height: 85px;
    background: var(--sun);
    box-shadow: 0 0 100px var(--sun-glow); /* 样本 004：太阳光晕 */
    border-radius: 50%;
  }
  .land {
    position: absolute; left: -10%; right: -10%;
    height: 40%; bottom: -15%;
    background: var(--land);
    border-radius: 50% 60% 0 0;
    transform: rotate(-7deg);              /* 样本 004：土地曲线 */
  }
  .house {
    position: absolute; bottom: 19%; left: 14%;
    width: 65%; height: 45%;
    background: linear-gradient(95deg, var(--wall-a), var(--wall-b));
    box-shadow: 30px 30px 0 #9a84674a;
  }
  .house::before {                         /* 斜屋顶 */
    content: '';
    position: absolute; left: -7%; width: 115%; height: 20px;
    background: #bbaa8e; top: -20px;
    transform: skewX(-25deg);              /* 样本 004：skewX 屋顶 */
  }
  .door {
    position: absolute; bottom: 0; left: 16%;
    width: 32%; height: 79%;
    border-radius: 50% 50% 0 0;
    background: linear-gradient(90deg, var(--door-a), var(--door-b));
    box-shadow: inset -12px 0 #988568;
  }
  .window {
    position: absolute; right: 10%; top: 22%;
    height: 43%; width: 23%;
    background: linear-gradient(120deg, #716953, #b0b3a0);
    border: 9px solid #c6b597;
  }
  .step {
    position: absolute; bottom: -12px; left: 8%;
    height: 12px; width: 50%;
    background: #b7a183;
    box-shadow: 0 12px #c4ad8c;
  }
  .shadow {
    position: absolute; bottom: 9%; left: 20%;
    height: 10%; width: 75%;
    background: #78614344;
    transform: skewX(45deg);               /* 样本 004：阴影 */
  }
  .annotation {
    position: absolute; bottom: 25px; left: 30px;
    font-size: 9px; letter-spacing: 2px;
    z-index: 2;
  }
  .scene.night { filter: brightness(.63) hue-rotate(325deg); }  /* ② 夜间模式 */

  footer {
    padding: 25px 5%;
    display: flex; justify-content: space-between;
    font-size: 9px; letter-spacing: 2px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .copy { padding: 40px 7%; }
    h1 { font-size: 65px; }
    .scene { min-height: 430px; }
    .specs { margin-top: 0; }
    .copy p { max-width: 380px; }
    header span { font-size: 8px; }
  }
  /* ⑧ reduced-motion 全尊重 */
  @media (prefers-reduced-motion: reduce) {
    .scene { transition: none; }
  }
</style>
</head>
<body>

<!-- ⑦ 结构：header → 编辑 intro → 大型 CSS 插画场景 → footer -->
<header>
  <div class="logo">stone</div>
  <span>SPACES THAT LET YOU EXHALE</span>
</header>

<main class="layout">
  <section class="copy">
    <div class="tiny">RESIDENCE NO. 07 / CONCEPT</div>
    <h1>砌入<br>山脊的沉默。</h1>
    <p>石、光，以及更少的一切。一间以当地毛石砌筑的山居，让建筑安静地退回山脊的轮廓。</p>
    <button id="light" aria-pressed="false">EXPLORE EVENING LIGHT ↗</button>
    <div class="specs">
      <div><strong>240</strong>M² FLOOR AREA</div>
      <div><strong>04</strong>SEASONS LIT</div>
    </div>
  </section>

  <div class="scene" id="scene" role="img" aria-label="山间石屋插画：太阳下的毛石住宅，拱形门洞与凹陷窗，山丘与阴影">
    <div class="sun"></div>
    <div class="land"></div>
    <div class="shadow"></div>
    <div class="house">
      <div class="door"></div>
      <div class="window"></div>
      <div class="step"></div>
    </div>
    <div class="annotation">27° 59′ N / 99° 43′ E<br><br>AN ARCHITECTURAL DAYDREAM</div>
  </div>
</main>

<footer>
  <span>EARTHBOUND ARCHITECTURE</span>
  <span>YUNNAN / STUDY 2026</span>
</footer>

<script>
  /* ④ 日光/暮光切换 + ⑧ aria-pressed（样本 004 做法） */
  document.querySelector('#light').onclick = (e) => {
    const night = document.querySelector('#scene').classList.toggle('night');
    e.target.textContent = night ? 'RETURN TO DAYLIGHT ↗' : 'EXPLORE EVENING LIGHT ↗';
    e.target.setAttribute('aria-pressed', String(night));
  };
</script>

</body>
</html>
